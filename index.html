<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<!-- Учебная страница: реквизиты никуда не отправляются, сетевые запросы запрещены (connect-src, form-action) -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline' https://telegram.org; style-src 'unsafe-inline'; connect-src 'none'; form-action 'none'; base-uri 'none'">
<title>Nurlight: тестовая оплата</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: var(--tg-theme-secondary-bg-color, #f1f2f5);
    --card: var(--tg-theme-bg-color, #fff);
    --text: var(--tg-theme-text-color, #15171a);
    --hint: var(--tg-theme-hint-color, #6b7280);
    --accent: var(--tg-theme-button-color, #2481cc);
    --on-accent: var(--tg-theme-button-text-color, #fff);
  }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 16px; background: var(--bg); color: var(--text);
         font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 420px; margin: 0 auto; }
  .test { background: #ffe9a8; color: #5c4300; border-radius: 12px; padding: 10px 14px; font-size: 14px; }
  .sum { text-align: center; margin: 20px 0; }
  .sum b { display: block; font-size: 34px; line-height: 1.2; }
  .sum span, label { color: var(--hint); font-size: 14px; }
  form { background: var(--card); border-radius: 16px; padding: 16px; }
  label { display: block; margin-bottom: 12px; }
  input { display: block; width: 100%; margin-top: 4px; padding: 12px; font: inherit; font-size: 18px;
          color: var(--text); background: var(--bg); border: 2px solid transparent; border-radius: 10px; }
  input:focus { outline: none; border-color: var(--accent); }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  button { font: inherit; cursor: pointer; border: 0; border-radius: 12px; }
  #pay { width: 100%; padding: 14px; font-weight: 600; background: var(--accent); color: var(--on-accent); }
  #pay:disabled { opacity: .6; }
  #error { color: #d93025; font-size: 14px; min-height: 20px; margin: 0 0 8px; }
  .cards { margin-top: 18px; font-size: 14px; color: var(--hint); }
  .cards button { display: flex; justify-content: space-between; gap: 8px; width: 100%; margin-top: 8px;
                  padding: 12px; background: var(--card); color: var(--text); font-size: 14px; text-align: left; }
</style>
</head>
<body>
<main>
  <div class="test" id="t-test"></div>
  <div class="sum"><span id="t-order"></span><b id="sum"></b></div>
  <form id="form" autocomplete="off" novalidate>
    <label><span id="t-number"></span>
      <input id="number" inputmode="numeric" autocomplete="off" maxlength="19" placeholder="0000 0000 0000 0000"></label>
    <div class="row">
      <label><span id="t-exp"></span>
        <input id="exp" inputmode="numeric" autocomplete="off" maxlength="5" placeholder="12/30"></label>
      <label>CVC
        <input id="cvc" type="password" inputmode="numeric" autocomplete="off" maxlength="3" placeholder="123"></label>
    </div>
    <p id="error" role="alert"></p>
    <button id="pay" type="submit"></button>
  </form>
  <div class="cards"><span id="t-cards"></span><div id="cards"></div></div>
</main>
<script>
(function () {
  var TEXT = {
    ru: { test: "🧪 Тестовая оплата. Деньги не списываются. Настоящую карту не вводите.",
          order: "Заказ №", number: "Номер карты", exp: "Срок (ММ/ГГ)", pay: "Оплатить ",
          wait: "Обрабатываем платёж…", cards: "Тестовые карты (нажмите, чтобы подставить):",
          good: "оплата пройдёт", bad: "банк откажет",
          eCard: "Принимаются только тестовые карты из списка ниже. Настоящую карту не вводите.",
          eExp: "Проверьте срок действия: нужна будущая дата.", eCvc: "CVC: 3 цифры.",
          eOpen: "Откройте страницу кнопкой в боте Nurlight." },
    kk: { test: "🧪 Тест төлемі. Ақша есептен шығарылмайды. Нағыз картаны енгізбеңіз.",
          order: "Тапсырыс №", number: "Карта нөмірі", exp: "Мерзімі (АА/ЖЖ)", pay: "Төлеу ",
          wait: "Төлем өңделуде…", cards: "Тест карталары (қою үшін басыңыз):",
          good: "төлем өтеді", bad: "банк бас тартады",
          eCard: "Тек төмендегі тест карталары қабылданады. Нағыз картаны енгізбеңіз.",
          eExp: "Мерзімін тексеріңіз: болашақ күн керек.", eCvc: "CVC: 3 сан.",
          eOpen: "Бетті Nurlight ботындағы түйме арқылы ашыңыз." },
    en: { test: "🧪 Test payment. No money is charged. Do not enter a real card.",
          order: "Order #", number: "Card number", exp: "Expiry (MM/YY)", pay: "Pay ",
          wait: "Processing payment…", cards: "Test cards (tap to fill in):",
          good: "will succeed", bad: "will be declined",
          eCard: "Only the test cards listed below are accepted. Do not enter a real card.",
          eExp: "Check the expiry date: it must be in the future.", eCvc: "CVC: 3 digits.",
          eOpen: "Open this page with the button in the Nurlight bot." }
  };
  // Единственные номера, которые принимает страница
  var CARDS = { "4242424242424242": "ok", "5555555555554444": "ok", "4000000000000002": "declined" };

  var params = new URLSearchParams(location.search);
  var lang = params.get("lang");
  var L = TEXT[lang] || TEXT.ru;
  var tg = window.Telegram && window.Telegram.WebApp;
  function $(id) { return document.getElementById(id); }
  function digits(s) { return s.replace(/\D/g, ""); }
  function spaced(s) { return s.replace(/(.{4})(?=.)/g, "$1 "); }

  document.documentElement.lang = TEXT[lang] ? lang : "ru";
  $("t-test").textContent = L.test;
  $("t-order").textContent = L.order + (params.get("n") || "");
  $("sum").textContent = params.get("sum") || "";
  $("t-number").textContent = L.number;
  $("t-exp").textContent = L.exp;
  $("pay").textContent = L.pay + (params.get("sum") || "");
  $("t-cards").textContent = L.cards;

  Object.keys(CARDS).forEach(function (card) {
    var b = document.createElement("button"), a = document.createElement("span"), c = document.createElement("span");
    b.type = "button";
    a.textContent = spaced(card);
    c.textContent = CARDS[card] === "ok" ? "✅ " + L.good : "❌ " + L.bad;
    b.append(a, c);
    b.onclick = function () {
      $("number").value = spaced(card);
      $("exp").value = "12/" + String((new Date().getFullYear() + 2) % 100).padStart(2, "0");
      $("cvc").value = "123";
      $("error").textContent = "";
    };
    $("cards").append(b);
  });

  $("number").oninput = function () { this.value = spaced(digits(this.value).slice(0, 16)); };
  $("exp").oninput = function () {
    var d = digits(this.value).slice(0, 4);
    this.value = d.length > 2 ? d.slice(0, 2) + "/" + d.slice(2) : d;
  };
  $("cvc").oninput = function () { this.value = digits(this.value); };

  function expOk(value) {
    var m = /^(\d\d)\/(\d\d)$/.exec(value);
    if (!m || +m[1] < 1 || +m[1] > 12) return false;
    return new Date(2000 + +m[2], +m[1], 1) > new Date();
  }

  $("form").onsubmit = function (event) {
    event.preventDefault();
    var result = CARDS[digits($("number").value)];
    var error = !result ? L.eCard : !expOk($("exp").value) ? L.eExp : $("cvc").value.length !== 3 ? L.eCvc : "";
    if (!error && !(tg && tg.platform && tg.platform !== "unknown")) error = L.eOpen;
    $("error").textContent = error;
    if (!result) { $("number").value = ""; $("exp").value = ""; $("cvc").value = ""; }
    if (error) return;

    $("pay").disabled = true;
    $("pay").textContent = L.wait;
    setTimeout(function () {
      // Боту уходит только номер заказа и результат, без реквизитов
      tg.sendData(JSON.stringify({ order: Number(params.get("o")), result: result }));
    }, 1500);
  };

  if (tg && tg.ready) { tg.ready(); tg.expand(); }
})();
</script>
</body>
</html>
